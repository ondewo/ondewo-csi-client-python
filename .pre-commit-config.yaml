#############################################################################################
# pre-commit is a "framework for managing and maintaining multi-language pre-commit hooks"  #
# see https://pre-commit.com/#intro for an introduction to pre-commit                       #
#                                                                                           #
# - pre-commit hooks are run on staged files just before a commit or a push                 #
# - to run a given hook on any file at any time, run the following on the command line:     #
#    pre-commit run <HOOK_ID> --files <FILE1> <FILE2> ..., e.g.,                            #
#    pre-commit run ruff --files mal_formatted_file.py                                       #
#############################################################################################

# Never lint/format the generated protobuf/gRPC stubs.
exclude: '(.*_pb2\.pyi?$|.*_pb2_grpc\.py$)'

fail_fast: false
# "fail_fast: false" means pre-commit continues to run hooks after the first failure

repos:

  # Markdown linting. MD013 (line-length) and MD033 (inline HTML) are disabled in
  # .markdownlint-cli2.yaml because the docs embed <p>/<code> and long lines.
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2

  # Ruff replaces flake8 (lint) AND black + autopep8 (format). Config lives in pyproject.toml
  # ([tool.ruff]); generated *_pb2* stubs are excluded via the global exclude above.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff  # Lint (replaces flake8)
        args: [ --fix ]
      - id: ruff-format  # Format (replaces black + autopep8)

  # mypy is a LOCAL hook run through `uv run --no-sync`, so it uses the project's .venv (and its
  # types-* packages) whether or not that venv is activated. It used to be declared against
  # mirrors-mypy with `language: system`, which builds no environment and ran a bare `mypy` from
  # PATH: a `git commit` from a shell without the .venv activated failed with
  # "Executable mypy not found". `--no-sync` keeps the hook from re-syncing the environment.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run --no-sync mypy --config-file=pyproject.toml
        language: system
        exclude: ondewo
        # require_serial so mypy is called once per commit, with every file
        require_serial: true
        types: [ python ]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files  # Prevent giant files from being committed
        args: [ maxkb=1024 ]
      - id: check-ast  # Check whether files parse as valid python
      - id: check-json  # Attempt to load json files to verify syntax
      - id: check-xml  # Attempt to load xml files to verify syntax
      - id: check-yaml  # Attempt to load yaml files to verify syntax
      - id: check-merge-conflict  # Check for files that contain merge conflict strings
      - id: check-symlinks  # Check for broken symlinks
      - id: debug-statements  # Check for debugger imports and py37+ breakpoint() calls
      - id: detect-private-key  # Check for the existence of private keys
      - id: check-executables-have-shebangs
      - id: trailing-whitespace  # Trim trailing whitespace.
      - id: end-of-file-fixer # makes sure files end in a newline and only a newline
      - id: pretty-format-json # autoformat json files (e.g. sorting keys)
        args: [ --autofix, --indent=4 ]
      - id: name-tests-test # name pytest files correctly
        args: [ --pytest-test-first ]

  # Keep uv.lock in sync with pyproject.toml.
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.28
    hooks:
      - id: uv-lock

  # ORDER IS LOAD-BEARING: conventional-pre-commit must validate the message the AUTHOR typed,
  # BEFORE giticket layers the `[TICKET] ` prefix onto it. pre-commit runs hooks in file order,
  # so with giticket first the validator sees `[OND211-2418] fix(x): y`, rejects the leading
  # prefix it was just handed, and NO conforming message can be committed -- which is why this
  # repo's recent history is full of non-conventional subjects committed with --no-verify.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [ commit-msg ]
  - repo: https://github.com/milin/giticket
    rev: '1.92'
    hooks:
      - id: giticket  # Prepend the commit message with the JIRA ticket
        args: [ '--regex=(?:(?:feature|bugfix|support|hotfix)/)?(OND[0-9]{3}-[0-9]{1,5})[_-][\w-]+',
                '--format=[{ticket}] {commit_msg}',
                '--mode=regex_match' ]

  # Enforce Conventional Commits on the commit message.
