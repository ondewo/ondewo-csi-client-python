name: tests

on:
  push:
    branches: [master, "release/**"]
    tags: ["*"]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout runs `git init`, which prints a multi-line `defaultBranchName` hint into every log
      # unless the initial branch name is configured.
      - name: Configure the initial git branch name
        run: git config --global init.defaultBranch master

      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          # One cache key per job: both jobs resolve the same uv.lock, and two jobs saving ONE key at the same time
          # made the slower one print "Unable to reserve cache ... another job may be creating this cache".
          cache-suffix: unit-tests

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install system libs for native deps (portaudio for pyaudio, pulled transitively via ondewo-s2t/t2s-client)
        run: sudo apt-get update && sudo apt-get install -y portaudio19-dev

      - name: Install package + dev/test dependencies (from uv.lock)
        run: uv sync --extra dev --frozen

      - name: Ruff lint (replaces flake8)
        run: uv run --frozen ruff check .

      - name: Mypy type check
        run: uv run --frozen mypy ondewo

      # The repo is ~95% generated protobuf/gRPC stubs; coverage is gated on the HAND-WRITTEN surface
      # — the production-critical code this SDK owns. `ondewo.csi.client` is exactly that surface:
      # the generated `*_pb2*` modules live in `ondewo/csi/`, one level up, and stay excluded.
      # Naming the package rather than four modules means a NEW hand-written module is covered by
      # this gate the day it is added, instead of silently sitting at 0% until someone extends the
      # list — which is how `async_client.py` went untested.
      - name: Unit tests + 100% coverage gate on hand-written code
        run: |
          uv run --frozen pytest tests/unit -q \
            --cov=ondewo.csi.client \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=100

  # Every hook of .pre-commit-config.yaml on every file: ruff FORMAT (which the job above does not check),
  # markdownlint, the mypy hook over tests/ and examples/, uv-lock and the file hygiene hooks. Without it a
  # commit made with --no-verify, or from a clone that never ran `pre-commit install`, reached master unchecked.
  pre-commit:
    runs-on: ubuntu-24.04
    steps:
      - name: Configure the initial git branch name
        run: git config --global init.defaultBranch master

      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-suffix: pre-commit

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install system libs for native deps (portaudio for pyaudio, pulled transitively via ondewo-s2t/t2s-client)
        run: sudo apt-get update && sudo apt-get install -y portaudio19-dev

      - name: Install package + dev dependencies (from uv.lock)
        run: uv sync --extra dev --frozen

      - name: Run every pre-commit hook on every file
        run: uv run --no-sync pre-commit run --all-files --show-diff-on-failure --color never
